name: Platform Property Operations Checks

on:
  push:
    branches:
      - build/property-operations-os
      - phase-2-ai-repair
      - openclaw-cell-runtime
  pull_request:
    branches:
      - main
      - phase-2-ai-repair
      - openclaw-cell-runtime

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whatchatai
          POSTGRES_PASSWORD: whatchatai
          POSTGRES_DB: whatchatai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U whatchatai -d whatchatai_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://whatchatai:whatchatai@127.0.0.1:5432/whatchatai_test
      REDIS_URL: redis://127.0.0.1:6379/1
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check AI call sites (no direct Gemini access outside AiGateway)
        run: npm run check:ai-call-sites
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --run
