name: Property Operations Integration

on:
  push:
    branches:
      - build/property-operations-os

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Mount platform routes into the existing server
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/server/index.ts')
          text = path.read_text(encoding='utf-8')

          import_line = "import { mountPlatformRoutes } from './platformRoutes.js';\n"
          mount_line = "mountPlatformRoutes(app);\n"

          if import_line not in text:
              anchor = "import { openclawMcpRouter } from './openclawMcpRouter.js';\n"
              if anchor not in text:
                  raise SystemExit('Expected OpenClaw import anchor was not found; refusing to patch index.ts')
              text = text.replace(anchor, anchor + import_line, 1)

          if mount_line not in text:
              anchor = "app.use(express.json({ limit: '20mb' }));\n"
              if anchor not in text:
                  raise SystemExit('Expected JSON parser anchor was not found; refusing to patch index.ts')
              text = text.replace(anchor, anchor + "\n// Platform routes are mounted explicitly here. Existing WhatsApp and OpenClaw routes remain separate.\n" + mount_line + "\n", 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit server integration if needed
        shell: bash
        run: |
          if git diff --quiet -- src/server/index.ts; then
            echo "Property platform routes are already mounted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/index.ts
          git commit -m "feat: mount property operations platform routes"
          git push origin HEAD:build/property-operations-os

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test -- --run

      - name: Production build
        run: npm run build
