name: Property Operations Integration

on:
  push:
    branches:
      - build/property-operations-os

permissions:
  contents: read

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify platform route mount
        shell: bash
        run: |
          grep -Fq "import { mountPlatformRoutes } from './platformRoutes.js';" src/server/index.ts
          grep -Fq "mountPlatformRoutes(app);" src/server/index.ts

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test -- --run

      - name: Production build
        run: npm run build
