name: Property Operations Integration

on:
  push:
    branches:
      - build/property-operations-os

permissions:
  contents: read

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whatchatai
          POSTGRES_PASSWORD: whatchatai
          POSTGRES_DB: whatchatai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U whatchatai -d whatchatai_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://whatchatai:whatchatai@127.0.0.1:5432/whatchatai_test
      REDIS_URL: redis://127.0.0.1:6379/1
      NODE_ENV: test
      # A throwaway per-run key, NOT the production one. CI builds an empty
      # database every run, so nothing it encrypts ever needs to be read back
      # by another run. Without this the field-level encryption service has no
      # master key and ~230 tests fail on "MASTER_ENCRYPTION_KEY is not
      # configured" - a missing CI secret, not a real regression. The real key
      # must never be put here: it is what makes production message bodies
      # readable, and it must stay stable for the life of that database.
      MASTER_ENCRYPTION_KEY: TEHNhbXBsZUNJT25seUtleU5vdFByb2R1Y3Rpb24xMg==

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check AI call sites (no direct Gemini access outside AiGateway)
        run: npm run check:ai-call-sites

      - name: Verify platform route mount
        shell: bash
        run: |
          grep -Fq "import { mountPlatformRoutes } from './platformRoutes.js';" src/server/index.ts
          grep -Fq "mountPlatformRoutes(app);" src/server/index.ts

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test -- --run

      - name: Production build
        run: npm run build
